[workspace]
members = [
    "data",
    "ipa",
    "language",
    "soundchange",
    "metonymy"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
cucumber = "0.23.0"
